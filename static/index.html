<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>影视拍摄连续性</title><style>body{font:15px system-ui;max-width:1100px;margin:24px auto;padding:0 16px;background:#f3f4f7}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:10px}input,textarea,select,button{padding:7px;margin:3px;border:1px solid #aaa;border-radius:6px}button{background:#4b2d6f;color:#fff}pre{white-space:pre-wrap;max-height:420px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}.scene{border-left:4px solid #4b2d6f;padding:8px 12px;margin:8px 0;background:#faf9fc}.shot{padding:4px 12px;color:#444}.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;margin-right:6px}.open{background:#fde8e8;color:#a02020}.exempted{background:#fdf3d7;color:#8a6100}.resolved{background:#e6f4ea;color:#1e6b33}.locked{background:#e3eafc;color:#2b4ac0}.cross{background:#f3e2f7;color:#7a1e92}table{border-collapse:collapse;width:100%;margin:6px 0}td,th{border:1px solid #ddd;padding:4px 8px;text-align:left;font-size:13px}h3{margin:14px 0 4px}</style><h1>影视拍摄连续性管理</h1><section><h2>连续性报告（项目视角，按叙事顺序）</h2><input id="production" type="number" placeholder="项目 ID"><button onclick="report()">查看报告</button><div id="reportview"></div><pre id="state"></pre></section><section><h2>状态与冲突</h2><div class="grid"><input id="scene" type="number" placeholder="场次 ID"><input id="shot" type="number" placeholder="镜头 ID"><input id="element" type="number" placeholder="元素 ID"><input id="user" type="number" placeholder="场记/制片 ID"><input id="value" placeholder="状态值"><input id="numeric" type="number" step="0.1" placeholder="数值"><input id="conflict" type="number" placeholder="冲突 ID"><input id="reviewer" type="number" placeholder="审片人 ID"><input id="reason" placeholder="理由"></div><button onclick="state()">设置状态并检测</button><button onclick="check()">重新检查场次</button><button onclick="lock()">锁定镜头</button><button onclick="exempt()">批准豁免</button><pre id="result"></pre></section><section><h2>调整方案</h2><input id="newvalue" placeholder="新状态"><input id="newnumeric" type="number" step="0.1" placeholder="新数值"><button onclick="propose()">提出方案</button><input id="plan" type="number" placeholder="方案 ID"><button onclick="approve()">批准方案</button><pre id="extra"></pre></section><script>
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const show=(e,x)=>document.querySelector(e).textContent=JSON.stringify(x,null,2);
async function get(u,e='#result'){show(e,await(await fetch(u)).json())}
async function post(u,b,e='#result'){show(e,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}
function statusTag(c){const s=c.active?c.status:'resolved';return `<span class="tag ${s}">${{open:'未处理',exempted:'已豁免',resolved:'已解决'}[s]}</span>`}
function conflictLine(c){const cross=(c.from_scene_number!==undefined&&c.from_scene_number!==c.to_scene_number)||c.cross_scene;return `${statusTag(c)}${cross?'<span class="tag cross">跨场</span>':''}<b>${esc(c.element_name)}</b>：${esc(c.from_scene_number??'')}/<b>${esc(c.from_shot_code)}</b> → ${esc(c.to_scene_number??'')}/<b>${esc(c.to_shot_code)}</b>（#${c.id}）<br><span style="color:#555">${esc(c.detail)}</span>`}
async function report(){
  const r=await(await fetch('/api/productions/'+production.value+'/continuity')).json();
  show('#state',r);
  if(!r.production){document.querySelector('#reportview').innerHTML='';return}
  let html=`<h3>${esc(r.production.title)}</h3><p>未处理冲突 ${r.open_conflicts}，已豁免 ${r.exempted_conflicts}</p>`;
  if(r.cross_scene_conflicts&&r.cross_scene_conflicts.length){
    html+='<h3>跨场冲突（挂在问题场次，前后镜头均标出）</h3>'+r.cross_scene_conflicts.map(c=>`<div class="scene">${conflictLine(c)}</div>`).join('');
  }
  html+='<h3>元素叙事链（只列显式登记点，未登记场次沿用前值）</h3><table><tr><th>元素</th><th>规则</th><th>叙事链登记点</th></tr>';
  for(const ch of (r.element_chains||[]))html+=`<tr><td>${esc(ch.element_name)}</td><td>${esc(ch.rule)}</td><td>${ch.chain.map(p=>esc(p.scene_number)+'/'+esc(p.shot_code)+'='+esc(p.state_value)+(p.numeric_value??'')).join(' → ')||'（尚未登记）'}</td></tr>`;
  html+='</table><h3>场次（按叙事顺序）</h3>';
  for(const s of r.scenes){
    html+=`<div class="scene"><b>场 ${esc(s.scene_number)} ${esc(s.title)}</b>（叙事序 ${s.narrative_order}）`;
    for(const sh of s.shots)html+=`<div class="shot">镜头 ${esc(sh.shot_code)} ${sh.status==='locked'?'<span class="tag locked">已锁定</span>':''}<span style="color:#888">拍摄序 ${sh.shoot_order}，叙事序 ${sh.narrative_order}</span>${sh.states.length?'：'+sh.states.map(st=>esc(st.state_value)+(st.numeric_value??'')).join('，'):''}</div>`;
    if(s.conflicts.length)html+='<div style="margin-top:6px">'+s.conflicts.map(conflictLine).join('<hr style="border:none;border-top:1px dashed #ccc">')+'</div>';
    html+='</div>';
  }
  document.querySelector('#reportview').innerHTML=html;
}
function state(){post('/api/shots/'+shot.value+'/states',{element_id:+element.value,state_value:value.value,numeric_value:numeric.value?+numeric.value:null,note:reason.value,user_id:+user.value})}
function check(){post('/api/scenes/'+scene.value+'/check',{})}
function lock(){post('/api/shots/'+shot.value+'/lock',{user_id:+user.value})}
function exempt(){post('/api/conflicts/'+conflict.value+'/exemptions',{reason:reason.value,reviewer_id:+reviewer.value})}
function propose(){post('/api/conflicts/'+conflict.value+'/plans',{new_value:newvalue.value,numeric_value:newnumeric.value?+newnumeric.value:null,reason:reason.value,user_id:+user.value})}
function approve(){post('/api/plans/'+plan.value+'/review',{approve:true,reviewer_id:+reviewer.value,note:reason.value},'#extra')}
report()</script></html>
