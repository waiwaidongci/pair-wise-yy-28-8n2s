<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>影视拍摄连续性</title><style>body{font:15px system-ui;max-width:1100px;margin:24px auto;padding:0 16px;background:#f3f4f7}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:10px}input,textarea,select,button{padding:7px;margin:3px;border:1px solid #aaa;border-radius:6px}button{background:#4b2d6f;color:#fff}pre{white-space:pre-wrap;max-height:420px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}.cross{color:#b42318;font-weight:600}.chain span{display:inline-block;padding:2px 6px;margin:2px;border-radius:5px;background:#eee}.chain b{color:#4b2d6f}.locked{background:#d7f0d7!important}</style><h1>影视拍摄连续性管理</h1><section><h2>连续性报告（项目视角）</h2><input id="production" type="number" placeholder="项目 ID"><button onclick="report()">查看报告</button><div id="summary"></div><div id="chain" class="chain"></div><h3>跨场冲突</h3><pre id="cross"></pre><pre id="state"></pre></section><section><h2>状态与冲突</h2><div class="grid"><input id="scene" type="number" placeholder="场次 ID"><input id="shot" type="number" placeholder="镜头 ID"><input id="element" type="number" placeholder="元素 ID"><input id="user" type="number" placeholder="场记/制片 ID"><input id="value" placeholder="状态值"><input id="numeric" type="number" step="0.1" placeholder="数值"><input id="conflict" type="number" placeholder="冲突 ID"><input id="reviewer" type="number" placeholder="审片人 ID"><input id="reason" placeholder="理由"></div><button onclick="state()">设置状态并检测</button><button onclick="check()">重新检查场次</button><button onclick="lock()">锁定镜头</button><button onclick="exempt()">批准豁免</button><pre id="result"></pre></section><section><h2>调整方案</h2><input id="newvalue" placeholder="新状态"><input id="newnumeric" type="number" step="0.1" placeholder="新数值"><button onclick="propose()">提出方案</button><input id="plan" type="number" placeholder="方案 ID"><button onclick="approve()">批准方案</button><pre id="extra"></pre></section><script>
const show=(e,x)=>document.querySelector(e).textContent=JSON.stringify(x,null,2);
async function get(u,e='#result'){show(e,await(await fetch(u)).json())}
async function post(u,b,e='#result'){show(e,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}
function renderReport(r){
  document.querySelector('#summary').innerHTML=`开放冲突 <b class="cross">${r.open_conflicts}</b>（其中跨场 <b class="cross">${r.open_cross_scene_conflicts.length}</b>），已豁免 ${r.exempted_conflicts}`;
  document.querySelector('#chain').innerHTML='叙事链：'+r.narrative_chain.map(x=>`<span class="${x.status==='locked'?'locked':''}">${x.scene_number}/${x.shot_code}${x.status==='locked'?' 🔒':''}</span>`).join(' → ');
  document.querySelector('#cross').innerHTML=r.cross_scene_conflicts.length?r.cross_scene_conflicts.map(c=>{
    const tone=c.active?(c.status==='exempted'?'':'cross'):'';
    return `<div class="${tone}">[${c.active?c.status:'resolved'}] ${c.detail} ｜ 前:${c.from_scene_number}/${c.from_shot_code} → 后:${c.to_scene_number}/${c.to_shot_code} #${c.id}</div>`;
  }).join(''):'<i>无跨场冲突</i>';
  show('#state',r.scenes.map(s=>({scene:s.scene_number,title:s.title,shots:s.shots.map(h=>h.shot_code),conflicts:s.conflicts.filter(c=>c.active).map(c=>({kind:c.kind,detail:c.detail,from:c.from_shot_code,to:c.to_shot_code,cross_scene:c.cross_scene,status:c.status,id:c.id}))})));
}
async function report(){const r=await(await fetch('/api/productions/'+production.value+'/continuity')).json();if(r.ok===false){show('#state',r);return}renderReport(r)}
function state(){post('/api/shots/'+shot.value+'/states',{element_id:+element.value,state_value:value.value,numeric_value:numeric.value?+numeric.value:null,note:reason.value,user_id:+user.value}).then(report)}
function check(){post('/api/scenes/'+scene.value+'/check',{}).then(report)}
function lock(){post('/api/shots/'+shot.value+'/lock',{user_id:+user.value}).then(report)}
function exempt(){post('/api/conflicts/'+conflict.value+'/exemptions',{reason:reason.value,reviewer_id:+reviewer.value}).then(report)}
function propose(){post('/api/conflicts/'+conflict.value+'/plans',{new_value:newvalue.value,numeric_value:newnumeric.value?+newnumeric.value:null,reason:reason.value,user_id:+user.value})}
function approve(){post('/api/plans/'+plan.value+'/review',{approve:true,reviewer_id:+reviewer.value,note:reason.value},'#extra').then(report)}
production.value=1;report();
</script></html>
